<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>세이빙스쿨 | 내 것이 되는 지식을 만나는 곳</title>
  <meta name="description" content="디지털 자산, 넘치는 정보보다 제대로된 배움이 필요하니까. 내 것이 되는 지식을 만나는 곳, 세이빙스쿨">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" sizes="64x64" href="images/favicon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preload" as="image" href="images/hero.webp" fetchpriority="high">
</head>
<body>
  <main class="fp" id="fp">
    <div class="fp-track" id="fp-track">

      <!-- 1. 첫 화면: 상단 바(크기 줄임) + 첫 화면 이미지 -->
      <section class="fp-section" id="hero" data-theme="dark" aria-label="첫 화면">
        <header class="site-header">
          <img class="logo" src="images/logo.png" width="270" height="64" alt="세이빙스쿨" draggable="false">
          <ul class="gnb">
            <li>강의</li>
            <li>세미나</li>
            <li>자료실</li>
            <li>추천도서</li>
            <li>강사 지원<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 9 9 3M4.2 3H9v4.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/></svg></li>
            <li>비트세이빙<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 9 9 3M4.2 3H9v4.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/></svg></li>
          </ul>
          <div class="auth">
            <span class="btn btn-line">로그인</span>
            <span class="btn btn-fill">회원가입</span>
          </div>
        </header>
        <div class="stage stage--top stage--hero">
          <div class="frame" style="--w:2000;--h:887">
            <img src="images/hero.webp" width="2000" height="887" fetchpriority="high" decoding="async" draggable="false"
                 alt="디지털 자산, 넘치는 정보보다 제대로된 배움이 필요하니까. 내 것이 되는 지식을 만나는 곳, 세이빙스쿨. 새로운 강의 소식받기, 무료 PDF 받기">
          </div>
        </div>
      </section>

      <!-- 2. 지금 볼 수 있는 세미나 -->
      <section class="fp-section bg-black" id="seminar" data-theme="dark" aria-label="지금 볼 수 있는 세미나">
        <div class="stage">
          <div class="frame" style="--w:2000;--h:1014">
            <img src="images/seminar.webp" width="2000" height="1014" decoding="async" draggable="false"
                 alt="지금 볼 수 있는 세미나: 그들은 왜, 비트코인을 잃어버렸을까? 비트코인 지갑의 필요성과 선택 (세이빙스쿨 × 봉현이형). 무료. 자세히 보기">
          </div>
        </div>
      </section>

      <!-- 3. 오픈 예정 강의 (세로가 짧아 위아래를 검정으로 채움) -->
      <section class="fp-section bg-black" id="upcoming" data-theme="dark" aria-label="오픈 예정 강의">
        <div class="stage">
          <div class="frame" style="--w:2000;--h:861">
            <img src="images/upcoming.webp" width="2000" height="861" decoding="async" draggable="false"
                 alt="오픈 예정 강의: 네이버 인플루언서 '봉현이형' 직강 비트코인 지갑 실전 클래스. 내 비트코인, 직접 보관하고 관리하는 방법. 12개월 할부 시 월 23,250원(21% 할인), 총 279,000원. 자세히 보기">
          </div>
        </div>
      </section>

      <!-- 4. 체계적인 전문 교육 (흰 배경 밝기 낮춤) -->
      <section class="fp-section bg-off" id="education" data-theme="light" aria-label="체계적인 전문 교육이 필요한 때">
        <div class="stage">
          <div class="frame" style="--w:2000;--h:1012">
            <img src="images/education.webp" width="2000" height="1012" decoding="async" draggable="false"
                 alt="체계적인 전문 교육이 필요한 때. 빠르게 변하고, 낯선 정보가 많은 분야일수록 많이 아는 것보다 제대로 이해하는 것이 중요합니다. 쉽게: 어려운 지식일수록 이해는 쉬워야 하니까. 제대로: 알아가는 만큼 보는 눈도 달라지니까. 직접: 활용할 수 있을 때 비로소 내 것이 되니까">
          </div>
        </div>
      </section>

      <!-- 5. 깊이 배우고, 새롭게 발견하는 곳 -->
      <section class="fp-section bg-black" id="class" data-theme="dark" aria-label="깊이 배우고, 새롭게 발견하는 곳">
        <div class="stage">
          <div class="frame" style="--w:2000;--h:1022">
            <img src="images/class.webp" width="2000" height="1022" decoding="async" draggable="false"
                 alt="깊이 배우고, 새롭게 발견하는 곳. 하나의 주제를 깊게 파고드는 강의, 전문가의 생생한 이야기를 만나는 세미나. CLASS: 궁금했던 하나의 주제를, 제대로 내 것으로! 강의 둘러보기">
          </div>
        </div>
      </section>

      <!-- 6. 자주 묻는 질문 + 회사 정보 (물음표 버튼은 여기에만, 노란색 한 가지) -->
      <section class="fp-section" id="faq" data-theme="light" aria-label="자주 묻는 질문">
        <div class="stage stage--bottom stage--faq">
          <div class="frame" style="--w:2000;--h:975">
            <img src="images/faq.webp" width="2000" height="975" decoding="async" draggable="false"
                 alt="자주 묻는 질문: 세이빙스쿨은 어떤 곳인가요? 디지털 자산을 처음 배우는 사람도 수강할 수 있나요? 어떤 강의와 세미나를 만나볼 수 있나요? 강의와 세미나는 무엇이 다른가요? 새로운 소식은 어디에서 확인할 수 있나요? (주)업루트컴퍼니 회사 정보">
            <img class="help-btn" src="images/help-button.svg" width="98" height="98" alt="" aria-hidden="true" draggable="false">
          </div>
        </div>
      </section>

    </div>
  </main>
  <nav class="fp-dots" id="fp-dots" aria-label="화면 이동"></nav>
  <script src="js/fullpage.js" defer></script>
</body>
</html>
